user attendiq-proxy;
worker_processes 1;
pid /run/attendiq-proxy.pid;
error_log /var/log/attendiq/proxy-error.log warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /var/lib/attendiq-proxy/body;
    proxy_temp_path /var/lib/attendiq-proxy/cache;
    client_max_body_size 32k;
    client_body_timeout 15s;
    limit_req_zone $binary_remote_addr zone=attendiq_requests:1m rate=10r/s;
    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        server_name socket.sukalyanai.com;
        ssl_certificate /etc/letsencrypt/live/socket.sukalyanai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/socket.sukalyanai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        error_page 413 = @too_large;
        location @too_large { default_type application/json; return 413 '{"error":"Request is too large."}'; }
        location / {
            limit_req zone=attendiq_requests burst=40 nodelay;
            proxy_pass http://127.0.0.1:3201;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
        }
    }
}
